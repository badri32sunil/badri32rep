---
- name: Simple Test Playbook
  hosts: Ubuntu
  gather_facts: no
  become: yes

  tasks:
    - name: Print a hello message
      debug:
        msg: "Hello from Ansible, triggered by Jenkins!"

    - name: Check disk space
      command: df -h
      register: disk_usage

    - name: Show disk usage output
      debug:
        var: disk_usage.stdout_lines
